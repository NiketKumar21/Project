services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: threatlens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"

  # 2. React + Vite Frontend Static Web Site
  - type: web
    name: threatlens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: threatlens-backend
          property: host
